<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><rect width="800" height="450" rx="16" fill="#fff8f2"/><g fill="#1f2937" font-family="Segoe UI, Roboto, Arial"><text x="40" y="60" font-size="28" font-weight="700">Enable Notifications — Firefox</text><text x="40" y="110" font-size="16">1) Click the shield/lock icon in the address bar</text><text x="40" y="140" font-size="16">2) Open Permissions → Notifications → Allow</text></g><rect x="40" y="180" width="720" height="220" rx="8" fill="#fff" stroke="#fbe7d6"/><text x="60" y="220" font-size="14" fill="#6b7280">Shield/Lock → Permissions → Notifications</text></svg>
