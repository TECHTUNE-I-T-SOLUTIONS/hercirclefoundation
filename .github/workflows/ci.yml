name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          # optional: pin a pnpm version, or omit to install the latest
          version: 8

      - name: Install dependencies
        # Some hosted runners may have lockfile format mismatches; allow install to proceed in CI
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
